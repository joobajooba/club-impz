# Fly.io settings for the live beta. Deploy from the repo root:
#   npm run deploy   (in game-server; it runs fly deploy with the paths below)
# One machine only: the room lives in that machine's memory, so two machines would split the players.
app = "club-impz-beta"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # stopping would drop everyone who is playing
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
